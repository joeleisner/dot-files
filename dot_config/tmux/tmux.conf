# Basics
set -g mouse on
set -g escape-time 10            # Helix needs a short escape delay
set -g focus-events on
set -g history-limit 50000

# True colour
set -g default-terminal "tmux-256color"
set -ga terminal-features ",*:RGB"

# Number windows and panes from 1, keep numbering gapless
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Splits and new windows open in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Reload this file
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded"

# Minimal status line: session name on the left, window list after it
set -g status-left-length 30
set -g status-left "[#S] "
set -g status-right ""

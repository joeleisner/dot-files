# Harness defaults. ssh uses the FIRST value it finds for each option, so this
# file is intentionally last. Any file you add to config.d must be prefixed
# lower than 99 (e.g. 50-work.conf) or these defaults will override it.
Host *
	ControlMaster auto
	ControlPath ~/.ssh/control/%C
	ControlPersist 10m
	ServerAliveInterval 60
	ServerAliveCountMax 3
	# For file-based keys with a regular agent; the 1Password agent manages its own keys
	AddKeysToAgent yes
	HashKnownHosts yes

# 1Password SSH agent. The socket lives at the same path on every platform
# (native Linux, macOS symlink, WSL relay). Only used when the socket exists, so
# machines without 1Password (e.g. servers you forward an agent to) keep using
# SSH_AUTH_SOCK. This is a default: any earlier file can set its own IdentityAgent.
Match exec "test -S %d/.1password/agent.sock"
	IdentityAgent %d/.1password/agent.sock

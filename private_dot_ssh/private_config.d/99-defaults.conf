# Harness defaults. ssh uses the FIRST value it finds for each option, so this
# file is intentionally last. Any file you add to config.d must be prefixed
# lower than 99 (e.g. 50-work.conf) or these defaults will override it.
Host *
	ControlMaster auto
	ControlPath ~/.ssh/control/%C
	ControlPersist 10m
	ServerAliveInterval 60
	ServerAliveCountMax 3
	AddKeysToAgent yes
	HashKnownHosts yes
